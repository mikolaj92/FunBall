name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
